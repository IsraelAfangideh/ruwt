# Deploy ruwt.ai (Vite + Cloudflare Pages Functions + D1) to Cloudflare Pages.
# Project: ruwt-ai → https://ruwt-ai.pages.dev (custom domain: ruwt.ai)
name: Deploy AI (Cloudflare Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'ai/**'
      - 'desktop/launcher/**'
      - 'desktop/scripts/package-launcher.sh'
      - '.github/workflows/deploy-ai.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure Cloudflare resources
        run: node scripts/setup-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Package Linux fallback launcher
        working-directory: .
        run: bash desktop/scripts/package-launcher.sh

      - name: Fetch Tauri desktop release
        working-directory: .
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ai/public/downloads
          gh release download desktop-latest --dir /tmp/ruwt-desk --clobber
          if [ -f /tmp/ruwt-desk/Ruwt.dmg ]; then
            cp /tmp/ruwt-desk/Ruwt.dmg ai/public/downloads/Ruwt.dmg
          fi
          if [ -f /tmp/ruwt-desk/Ruwt-Setup.exe ]; then
            cp /tmp/ruwt-desk/Ruwt-Setup.exe ai/public/downloads/Ruwt-Setup.exe
          fi
          ls -lh ai/public/downloads || true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Create GitHub deployment
        id: deployment
        continue-on-error: true
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: AI Production
          production-environment: true
          ref: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: npx wrangler pages deploy dist --project-name=ruwt-ai --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set runtime secrets
        run: |
          echo "${{ secrets.VITE_SUPABASE_URL }}" | npx wrangler pages secret put SUPABASE_URL --project-name=ruwt-ai
          echo "${{ secrets.VITE_SUPABASE_ANON_KEY }}" | npx wrangler pages secret put SUPABASE_ANON_KEY --project-name=ruwt-ai
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler pages secret put RESEND_API_KEY --project-name=ruwt-ai
          echo "${{ secrets.ERROR_ALERT_EMAIL }}" | npx wrangler pages secret put ERROR_ALERT_EMAIL --project-name=ruwt-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ruwt-ai --remote
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Redeploy with runtime bindings
        run: npx wrangler pages deploy dist --project-name=ruwt-ai --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attach custom domain and fix DNS
        run: node scripts/setup-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update deployment status (success)
        if: success() && steps.deployment.outputs.deployment_id != ''
        continue-on-error: true
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://ruwt-ai.pages.dev

      - name: Update deployment status (failure)
        if: failure() && steps.deployment.outputs.deployment_id != ''
        continue-on-error: true
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

      - name: Post-deploy smoke test
        if: success()
        run: |
          sleep 15
          FAILED=0

          echo "Checking https://ruwt-ai.pages.dev/api/health ..."
          HTTP=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' https://ruwt-ai.pages.dev/api/health)
          if [ "$HTTP" = "200" ]; then
            echo "Smoke test passed: ruwt-ai.pages.dev HTTP $HTTP"
          else
            echo "::error::Pages deploy smoke test failed: HTTP $HTTP"
            FAILED=$((FAILED+1))
          fi

          echo "Checking https://ruwt.ai/api/health ..."
          HTTP=$(curl -s --max-time 20 -o /dev/null -w '%{http_code}' https://ruwt.ai/api/health || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "Smoke test passed: ruwt.ai HTTP $HTTP"
          else
            echo "::warning::Custom domain not ready yet: ruwt.ai HTTP $HTTP (pages.dev is live)"
          fi

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi
