# Deploy ruwt.ai (Vite + Cloudflare Pages Functions + D1) to Cloudflare Pages.
# Project: ruwt-ai → https://ruwt-ai.pages.dev (custom domain: ruwt.ai)
name: Deploy AI (Cloudflare Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'ai/**'
      - '.github/workflows/deploy-ai.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ai/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure Cloudflare resources
        run: node scripts/setup-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Create GitHub deployment
        id: deployment
        continue-on-error: true
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: AI Production
          production-environment: true
          ref: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: npx wrangler pages deploy dist --project-name=ruwt-ai --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set runtime secrets
        run: |
          echo "${{ secrets.VITE_SUPABASE_URL }}" | npx wrangler pages secret put SUPABASE_URL --project-name=ruwt-ai
          echo "${{ secrets.VITE_SUPABASE_ANON_KEY }}" | npx wrangler pages secret put SUPABASE_ANON_KEY --project-name=ruwt-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ruwt-ai --remote
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Redeploy with runtime bindings
        run: npx wrangler pages deploy dist --project-name=ruwt-ai --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update deployment status (success)
        if: success() && steps.deployment.outputs.deployment_id != ''
        continue-on-error: true
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://ruwt-ai.pages.dev

      - name: Update deployment status (failure)
        if: failure() && steps.deployment.outputs.deployment_id != ''
        continue-on-error: true
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

      - name: Post-deploy smoke test
        if: success()
        run: |
          sleep 10
          for URL in https://ruwt.ai/api/health https://ruwt-ai.pages.dev/api/health; do
            HTTP=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$URL")
            if [ "$HTTP" = "200" ]; then
              echo "Smoke test passed: $URL HTTP $HTTP"
              exit 0
            fi
            echo "Smoke test pending for $URL: HTTP $HTTP"
          done
          echo "::error::Smoke test failed on ruwt.ai and ruwt-ai.pages.dev"
          exit 1

      - name: Attach custom domain
        if: success()
        continue-on-error: true
        run: node scripts/setup-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
