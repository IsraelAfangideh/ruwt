name: Daily Streak Nudge

on:
  workflow_dispatch: # manual trigger only — scheduled sends disabled

jobs:
  send:
    name: Send Streak Nudge Emails
    runs-on: ubuntu-latest
    steps:
      - name: Trigger streak nudge
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://ruwt.dev/api/streak-nudge" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "::error::Streak nudge failed with status $http_code"
            exit 1
          fi
