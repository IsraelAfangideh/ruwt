# Deploy dev app preview for pull requests.
# Each PR gets its own URL: <branch>.ruwt-dev.pages.dev
# Uses an isolated preview D1 database (ruwt-dev-preview).
name: Deploy Dev Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'dev/**'
      - '.github/workflows/deploy-dev-preview.yml'

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Ensure preview R2 bucket
        # Pages publish requires the wrangler.toml preview bucket to exist.
        # CLOUDFLARE_ADMIN_API_TOKEN cannot list/create R2 (error 10000). Try
        # the Pages deploy token first (it can apply D1), then the admin token.
        # If neither can create ruwt-projects-preview, rebind preview to the
        # existing ruwt-projects bucket so the Function still publishes.
        id: r2
        continue-on-error: true
        run: |
          if node scripts/ensure-preview-resources.mjs; then
            exit 0
          fi
          echo "Pages deploy token could not ensure R2; retrying with admin token."
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_ADMIN_API_TOKEN}"
          node scripts/ensure-preview-resources.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Rebind preview R2 to existing bucket
        if: steps.r2.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("wrangler.toml")
          text = path.read_text()
          old = 'bucket_name = "ruwt-projects-preview"'
          new = 'bucket_name = "ruwt-projects"'
          if old not in text:
              raise SystemExit("preview R2 bucket_name not found in wrangler.toml")
          path.write_text(text.replace(old, new, 1))
          print("Rebound preview PROJECTS_BUCKET to existing ruwt-projects bucket.")
          PY

      - name: Apply migrations to preview D1
        # Requires D1:Edit. Try the Pages deploy token first (known-working for
        # wrangler pages deploy), then the admin token. Still continue so a
        # schema-less preview can at least serve the UI.
        continue-on-error: true
        run: |
          apply_preview_d1() {
            npx wrangler d1 migrations apply ruwt-dev-preview --remote --env preview
          }
          if apply_preview_d1; then
            exit 0
          fi
          echo "Pages deploy token could not apply D1 migrations; retrying with admin token."
          export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_ADMIN_API_TOKEN}"
          apply_preview_d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ADMIN_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create GitHub deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: Preview
          ref: ${{ github.sha }}

      - name: Deploy preview
        id: deploy
        run: |
          # Run wrangler directly. This used to be `OUTPUT=$(npx wrangler ...)`
          # followed by `echo "$OUTPUT"`, but the step runs under `bash -e`, so a
          # non-zero exit aborted it before the echo — every failure for months
          # reported nothing but "exit code 1".
          npx wrangler pages deploy dist --project-name=ruwt-dev --branch="$HEAD_REF" --commit-dirty=true
          # Cloudflare Pages converts / to - in branch subdomain URLs
          echo "preview_url=https://${HEAD_REF//\//-}.ruwt-dev.pages.dev" >> "$GITHUB_OUTPUT"
        env:
          # Via env, not inline ${{ }}: a branch name is attacker-controlled on
          # fork PRs and would otherwise be interpolated straight into the shell.
          HEAD_REF: ${{ github.head_ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: ${{ steps.deploy.outputs.preview_url }}

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const body = `### Preview Deploy\n\n` +
              `**URL:** ${previewUrl}\n` +
              `**Commit:** \`${context.sha.slice(0, 7)}\`\n\n` +
              `> Preview uses an isolated database (\`ruwt-dev-preview\`). ` +
              `Production (\`ruwt.dev\`) is unaffected.`;

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Preview Deploy')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Smoke tests
        if: success()
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          echo "=== Preview smoke tests against $PREVIEW_URL ==="
          sleep 10
          FAILED=0

          # Test 1: Landing page returns 200
          echo "Test 1: Landing page..."
          HTTP=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' "$PREVIEW_URL/")
          if [ "$HTTP" != "200" ]; then
            echo "  FAIL: HTTP $HTTP (expected 200)"
            FAILED=$((FAILED+1))
          else
            echo "  PASS"
          fi

          # Test 2: Functions are running (401 = auth guard, 500 = config issue but Functions alive)
          echo "Test 2: Functions running..."
          HTTP=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' "$PREVIEW_URL/api/profile")
          if [ "$HTTP" = "401" ] || [ "$HTTP" = "500" ]; then
            echo "  PASS (HTTP $HTTP — Functions responding)"
          else
            echo "  FAIL: HTTP $HTTP (expected 401 or 500)"
            FAILED=$((FAILED+1))
          fi

          echo ""
          echo "=== $FAILED failure(s) ==="
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED preview smoke test(s) failed"
            exit 1
          fi
