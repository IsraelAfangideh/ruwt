# Deploy dev app preview for pull requests.
# Each PR gets its own URL: <branch>.ruwt-dev.pages.dev
# Uses an isolated preview D1 database (ruwt-dev-preview).
name: Deploy Dev Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Apply migrations to preview D1
        # Requires a token with D1:Edit scope. Falls back gracefully if unavailable.
        # To fix: add D1:Edit permission to CLOUDFLARE_ADMIN_API_TOKEN in CF Dashboard.
        continue-on-error: true
        run: npx wrangler d1 migrations apply ruwt-dev-preview --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview
        id: deploy
        run: |
          OUTPUT=$(npx wrangler pages deploy dist --project-name=ruwt-dev --branch=${{ github.head_ref }} 2>&1)
          echo "$OUTPUT"
          PREVIEW_URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.ruwt-dev\.pages\.dev' | head -1)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="https://${{ github.head_ref }}.ruwt-dev.pages.dev"
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const body = `### Preview Deploy\n\n` +
              `**URL:** ${previewUrl}\n` +
              `**Commit:** \`${context.sha.slice(0, 7)}\`\n\n` +
              `> Preview uses an isolated database (\`ruwt-dev-preview\`). ` +
              `Production (\`ruwt.dev\`) is unaffected.`;

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Preview Deploy')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Smoke tests
        if: success()
        run: |
          PREVIEW_URL="${{ steps.deploy.outputs.preview_url }}"
          echo "=== Preview smoke tests against $PREVIEW_URL ==="
          sleep 10
          FAILED=0

          # Test 1: Landing page returns 200
          echo "Test 1: Landing page..."
          HTTP=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' "$PREVIEW_URL/")
          if [ "$HTTP" != "200" ]; then
            echo "  FAIL: HTTP $HTTP (expected 200)"
            FAILED=$((FAILED+1))
          else
            echo "  PASS"
          fi

          # Test 2: Functions are running (401 = auth guard, 500 = config issue but Functions alive)
          echo "Test 2: Functions running..."
          HTTP=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' "$PREVIEW_URL/api/profile")
          if [ "$HTTP" = "401" ] || [ "$HTTP" = "500" ]; then
            echo "  PASS (HTTP $HTTP — Functions responding)"
          else
            echo "  FAIL: HTTP $HTTP (expected 401 or 500)"
            FAILED=$((FAILED+1))
          fi

          echo ""
          echo "=== $FAILED failure(s) ==="
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED preview smoke test(s) failed"
            exit 1
          fi
