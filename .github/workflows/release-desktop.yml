# Release Ruwt desktop (Tauri) as a real windowed app.
# macOS → DMG (Linear-style drag to Applications)
# Windows → NSIS setup exe
#
# macOS signing uses the iOS App Store Connect API key already in this repo:
#   APP_STORE_CONNECT_API_KEY_KEY, APP_STORE_CONNECT_API_KEY_KEY_ID,
#   APP_STORE_CONNECT_API_KEY_ISSUER_ID
# Optional override: APPLE_CERTIFICATE + APPLE_CERTIFICATE_PASSWORD (.p12)
name: Release Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - '.github/workflows/release-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Restore Developer ID
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: desktop/.signing/developer-id.p12.enc
          key: ruwt-developer-id-v1

      - name: Ensure Developer ID
        working-directory: desktop
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 -m venv .sign-venv
          .sign-venv/bin/pip install pyjwt cryptography
          .sign-venv/bin/python scripts/ensure-developer-id.py

      - name: Save Developer ID
        if: success() && steps.signing-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: desktop/.signing/developer-id.p12.enc
          key: ruwt-developer-id-v1

      - name: Build app
        working-directory: desktop
        run: |
          test -n "${APPLE_SIGNING_IDENTITY:-}"
          test "${APPLE_SIGNING_IDENTITY}" != "-"
          echo "Signing as ${APPLE_SIGNING_IDENTITY}"
          unset APPLE_ID APPLE_PASSWORD
          npx tauri build --bundles app

      - name: Build Linear-style DMG
        working-directory: desktop
        run: |
          python3 -m venv .dmg-venv
          .dmg-venv/bin/pip install dmgbuild
          export PATH="$PWD/.dmg-venv/bin:$PATH"
          python3 scripts/build-macos-dmg.py

      - name: Notarize DMG
        working-directory: desktop
        run: python3 scripts/notarize-macos-dmg.py

      - name: Rename artifact
        run: |
          DMG=desktop/src-tauri/target/release/bundle/dmg/Ruwt.dmg
          test -f "$DMG"
          mkdir -p dist-desktop
          cp "$DMG" dist-desktop/Ruwt.dmg
          ls -lh dist-desktop/Ruwt.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ruwt-macos-dmg
          path: dist-desktop/Ruwt.dmg
          if-no-files-found: error

  windows:
    name: Build Windows setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - name: Rename artifact
        shell: bash
        run: |
          EXE=$(find desktop/src-tauri/target -name '*setup.exe' -o -name '*nsis.exe' | head -n 1)
          test -n "$EXE"
          mkdir -p dist-desktop
          cp "$EXE" dist-desktop/Ruwt-Setup.exe
          ls -lh dist-desktop/Ruwt-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ruwt-windows-nsis
          path: dist-desktop/Ruwt-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-desktop
          merge-multiple: true

      - name: Write update manifest
        run: |
          python3 <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          root = Path("dist-desktop")
          version = json.loads(Path("desktop/package.json").read_text())["version"]
          manifest = {
              "version": version,
              "commit": os.environ["GITHUB_SHA"],
              "publishedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes": "Windowed Ruwt app. macOS: open the DMG and drag Ruwt to Applications. Windows: run Ruwt-Setup.exe.",
              "platforms": {
                  "darwin": {
                      "url": "https://ruwt.ai/downloads/Ruwt.dmg",
                      "filename": "Ruwt.dmg",
                      "sha256": sha256(root / "Ruwt.dmg"),
                  },
                  "windows": {
                      "url": "https://ruwt.ai/downloads/Ruwt-Setup.exe",
                      "filename": "Ruwt-Setup.exe",
                      "sha256": sha256(root / "Ruwt-Setup.exe"),
                  },
              },
          }
          (root / "desktop-latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish desktop-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh dist-desktop
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest dist-desktop/Ruwt.dmg dist-desktop/Ruwt-Setup.exe dist-desktop/desktop-latest.json --clobber
          else
            gh release create desktop-latest dist-desktop/Ruwt.dmg dist-desktop/Ruwt-Setup.exe dist-desktop/desktop-latest.json \
              --title "Ruwt desktop" \
              --notes "Windowed Ruwt app. macOS: open the DMG and drag Ruwt to Applications. Windows: run Ruwt-Setup.exe."
          fi

      - name: Refresh ruwt.ai downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy AI (Cloudflare Pages)" --ref main
