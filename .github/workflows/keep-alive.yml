name: Synthetic Health Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run health checks
        run: |
          FAILED=0
          RESULTS=""

          # Retry helper: curl_check URL TIMEOUT
          # Returns HTTP status code, retries once after 5s on timeout/failure
          curl_check() {
            local url="$1" timeout="${2:-15}"
            local http
            http=$(curl -s -o /dev/null -w '%{http_code}' --max-time "$timeout" "$url")
            if [ "$http" = "200" ]; then
              echo "$http"; return
            fi
            echo "  Retry after cold-start (got $http)..." >&2
            sleep 5
            curl -s -o /dev/null -w '%{http_code}' --max-time "$timeout" "$url"
          }

          # Check 1: ruwt.dev landing page
          echo "Checking ruwt.dev..."
          HTTP=$(curl_check "https://ruwt.dev/")
          if [ "$HTTP" != "200" ]; then
            echo "  FAIL: ruwt.dev -> $HTTP"
            RESULTS="${RESULTS}- FAIL: https://ruwt.dev/ -> HTTP $HTTP\n"
            FAILED=$((FAILED+1))
          else
            echo "  OK: ruwt.dev -> $HTTP"
            RESULTS="${RESULTS}- OK: https://ruwt.dev/ -> $HTTP\n"
          fi

          # Check 2: Challenges API (CF Pages Functions — prone to cold starts)
          echo "Checking challenges API..."
          HTTP=$(curl_check "https://ruwt.dev/api/challenges" 20)
          if [ "$HTTP" != "200" ]; then
            echo "  FAIL: challenges API -> $HTTP"
            RESULTS="${RESULTS}- FAIL: /api/challenges -> HTTP $HTTP\n"
            FAILED=$((FAILED+1))
          else
            echo "  OK: challenges API -> $HTTP"
            RESULTS="${RESULTS}- OK: /api/challenges -> $HTTP\n"
          fi

          # Check 3: Piston (code execution engine) — run actual code
          echo "Checking Piston..."
          run_piston() {
            curl -s --max-time 15 -X POST https://ruwt-exec.fly.dev/api/v2/piston/execute \
              -H "Content-Type: application/json" \
              -d '{"language":"python","version":"3.10.0","files":[{"content":"print(42)"}],"run_timeout":5000}'
          }
          parse_piston() {
            echo "$1" | python3 -c "import sys,json; print(json.load(sys.stdin).get('run',{}).get('stdout','').strip())" 2>/dev/null || echo ""
          }
          PISTON_RESP=$(run_piston)
          PISTON_OUT=$(parse_piston "$PISTON_RESP")
          if [ "$PISTON_OUT" != "42" ]; then
            echo "  Retry Piston after cold-start..."
            sleep 5
            PISTON_RESP=$(run_piston)
            PISTON_OUT=$(parse_piston "$PISTON_RESP")
          fi
          if [ "$PISTON_OUT" = "42" ]; then
            echo "  OK: Piston executed correctly"
            RESULTS="${RESULTS}- OK: Piston -> print(42) = 42\n"
          else
            echo "  FAIL: Piston output='$PISTON_OUT'"
            RESULTS="${RESULTS}- FAIL: Piston expected '42', got '$PISTON_OUT'\n"
            FAILED=$((FAILED+1))
          fi

          # Check 4: Supabase auth health
          echo "Checking Supabase..."
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            "${{ secrets.VITE_SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          if [ "$HTTP" != "200" ]; then
            echo "  FAIL: Supabase -> $HTTP"
            RESULTS="${RESULTS}- FAIL: Supabase auth health -> HTTP $HTTP\n"
            FAILED=$((FAILED+1))
          else
            echo "  OK: Supabase -> $HTTP"
            RESULTS="${RESULTS}- OK: Supabase auth -> $HTTP\n"
          fi

          # Check 5: Health endpoint (internal system check)
          echo "Checking health endpoint..."
          HTTP=$(curl_check "https://ruwt.dev/api/health" 30)
          if [ "$HTTP" != "200" ]; then
            echo "  WARN: health endpoint -> $HTTP"
            RESULTS="${RESULTS}- WARN: /api/health -> HTTP $HTTP\n"
          else
            echo "  OK: health endpoint -> $HTTP"
            RESULTS="${RESULTS}- OK: /api/health -> $HTTP\n"
          fi

          echo ""
          echo "=== $FAILED failure(s) ==="

          # Send alert email on failure
          if [ "$FAILED" -gt 0 ]; then
            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "Sending alert..."
            curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "
          import json
          results = '''$(printf "$RESULTS")'''
          print(json.dumps({
              'from': 'ruwt.dev alerts <alerts@ruwt.dev>',
              'to': ['${{ secrets.ERROR_ALERT_EMAIL }}'],
              'subject': '[ruwt.dev DOWN] ${FAILED} service(s) failing',
              'html': '<h2>Health Check Alert</h2><p>Time: ${TIMESTAMP}</p><pre>' + results + '</pre><p>This check runs every 5 minutes via <a href=\"https://github.com/${{ github.repository }}/actions/workflows/keep-alive.yml\">GitHub Actions</a>.</p>'
          }))
          ")"
            echo "::error::$FAILED health check(s) failed"
            exit 1
          fi
