name: Seed Production Data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED_PROD to confirm'
        required: true
        default: ''
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false
      seed_memory:
        description: 'Seed default memory'
        required: false
        type: boolean
        default: true
      target:
        description: 'Target database'
        type: choice
        options:
          - supabase
        default: supabase

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SEED_DRY_RUN: ${{ inputs.dry_run }}
      SEED_MEMORY: ${{ inputs.seed_memory }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "SEED_PROD" ]; then
            echo "Refusing to seed: confirmation missing."
            exit 1
          fi

      - name: Ensure DATABASE_URL present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing SUPABASE_DATABASE_URL secret."
            exit 1
          fi

      - name: Install dependencies
        run: bun install
        working-directory: ./social/code

      - name: Verify migrations applied
        run: |
          bun --eval "import postgres from 'postgres'; const sql = postgres(process.env.DATABASE_URL); const [row] = await sql\`
            select 1 as ok
            from information_schema.columns
            where table_schema = 'public'
              and table_name = 'runners'
              and column_name = 'kind'
            limit 1
          \`; await sql.end(); if (!row?.ok) { console.error('Missing runners.kind. Run migrations before seeding.'); process.exit(1); }"
        working-directory: ./social/code/api

      - name: Run seed
        run: bun run db:seed
        working-directory: ./social/code/api
