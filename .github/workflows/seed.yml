name: Seed Production Data

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED_PROD to confirm'
        required: true
        default: ''
      target:
        description: 'Target database'
        type: choice
        options:
          - supabase
        default: supabase

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1

      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "SEED_PROD" ]; then
            echo "Refusing to seed: confirmation missing."
            exit 1
          fi

      - name: Ensure DATABASE_URL present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing SUPABASE_DATABASE_URL secret."
            exit 1
          fi

      - name: Install dependencies
        run: bun install
        working-directory: ./code

      - name: Run seed
        run: bun run db:seed
        working-directory: ./code/api
