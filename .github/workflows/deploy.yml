name: Deployment

on:
  push:
    branches:
      - main
  schedule:
    # Monthly builds: 1st of each month at 9:00 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      build_native:
        description: 'Build native apps (iOS/Android)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  # ------------------------------------------------------------------
  # 0. MARKETING WEBSITE DEPLOYMENT (Cloudflare Pages)
  # Runs on: push to main, manual trigger
  # ------------------------------------------------------------------
  deploy-web:
    name: Deploy Marketing Site to Cloudflare Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ruwt
          directory: code/web

  # ------------------------------------------------------------------
  # 1. API DEPLOYMENT
  # Runs on: push to main, manual trigger
  # ------------------------------------------------------------------
  deploy-api:
    name: Deploy API to Fly.io
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./code
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --config api/fly.toml --dockerfile api/Dockerfile .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ------------------------------------------------------------------
  # 2. OTA UPDATE (Every push to main)
  # Delivers JS/asset changes to all users with app installed
  # ------------------------------------------------------------------
  mobile-ota-update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: ./code/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install Dependencies
        run: cd .. && bun install
      - name: Publish Update
        run: |
          eas update --branch production --message "Auto-deploy commit: ${{ github.sha }}"

  # ------------------------------------------------------------------
  # 3. NATIVE BUILDS (Monthly schedule or manual trigger)
  # Builds and submits to App Store Connect / Google Play Console
  # ------------------------------------------------------------------
  
  # Android Build & Submit
  android-store-build:
    name: Android Build & Submit
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_native == 'true')
    defaults:
      run:
        working-directory: ./code/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install Dependencies
        run: cd .. && bun install
      - name: Build and Submit
        run: eas build --platform android --profile production --auto-submit --non-interactive

  # iOS: Check Store Status
  check-apple-status:
    name: Check Apple Store Status
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_native == 'true')
    defaults:
      run:
        working-directory: ./code/mobile
    outputs:
      should_build: ${{ steps.set_output.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Install Fastlane
        run: bundle install

      - name: Check Status Script
        id: check
        run: bundle exec ruby fastlane/check_store_status.rb
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        continue-on-error: true 

      - name: Set Output
        id: set_output
        if: steps.check.outcome == 'success'
        run: echo "should_build=true" >> $GITHUB_OUTPUT

  # iOS: Build & Submit to TestFlight
  ios-store-build:
    name: iOS Build & Submit to TestFlight
    runs-on: ubuntu-latest
    needs: check-apple-status
    if: needs.check-apple-status.outputs.should_build == 'true'
    outputs:
      build_success: ${{ steps.build.outcome == 'success' }}
    defaults:
      run:
        working-directory: ./code/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install Dependencies
        run: cd .. && bun install
      - name: Build and Submit to TestFlight
        id: build
        run: eas build --platform ios --profile production --auto-submit --non-interactive

  # iOS: Submit to App Store Review (after TestFlight upload)
  ios-app-store-submit:
    name: iOS Submit for App Store Review
    runs-on: ubuntu-latest
    needs: ios-store-build
    if: success()
    defaults:
      run:
        working-directory: ./code/mobile
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      
      - name: Install Fastlane
        run: bundle install
      
      # Wait for TestFlight processing (Apple needs time to process the build)
      - name: Wait for TestFlight Processing
        run: |
          echo "Waiting 5 minutes for Apple to process the TestFlight build..."
          sleep 300
      
      - name: Submit for App Store Review
        run: bundle exec fastlane ios submit_for_review
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
