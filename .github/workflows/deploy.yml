name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_web:
        description: 'Force web deployment'
        required: false
        type: boolean
        default: false
      force_api:
        description: 'Force API deployment'
        required: false
        type: boolean
        default: false
      force_native:
        description: 'Force native mobile build'
        required: false
        type: boolean
        default: false
      force_ota:
        description: 'Force mobile OTA update'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # STEP 1: THE BRAIN (Decide what changed)
  # ------------------------------------------------------------------
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      mobile_native: ${{ steps.override.outputs.mobile_native }}
      mobile_any: ${{ steps.override.outputs.mobile_any }}
      web: ${{ steps.override.outputs.web }}
      api: ${{ steps.override.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          # CRITICAL: We need full history to compare commits/tags
          fetch-depth: 0
      
      - name: Determine Diff Base
        id: base
        run: |
          # 1. Check for the Native Tag (Stateful Logic)
          # We verify it exists and output the SHA directly
          if git rev-parse --verify production-mobile-native-last-success >/dev/null 2>&1; then
            BASE_REF=$(git rev-parse production-mobile-native-last-success)
            echo "Using stateful tag SHA: $BASE_REF"
          
          # 2. Check for Previous Commit (Fallback for standard pushes)
          # checking if 'before' is set and not the null-hash
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
             BASE_REF="${{ github.event.before }}"
             echo "Using github.event.before SHA: $BASE_REF"
          
          # 3. Final Fallback (Resolve HEAD~1 to SHA)
          else
            # CRITICAL FIX: We must resolve HEAD~1 to a specific SHA.
            # Passing the string "HEAD~1" causes the 'invalid refspec' error in paths-filter.
            BASE_REF=$(git rev-parse HEAD~1)
            echo "Using HEAD~1 SHA: $BASE_REF"
          fi
          
          # Verify we have a valid SHA (safety check)
          if [ ${#BASE_REF} -ne 40 ]; then
            echo "Error: base_ref is not a valid SHA: $BASE_REF"
            exit 1
          fi
          
          # Output the SHA
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          # Now this is always a clean SHA (e.g., a1b2c3d...)
          base: ${{ steps.base.outputs.base_ref }}
          filters: |
            web:
              - 'code/web/**'
              - 'code/mobile/src/**'      # Mobile source = web source
              - 'code/mobile/App.tsx'
              - 'code/mobile/app.json'
              - 'code/shared/**'          # Shared types
            api:
              - 'code/api/**'
            mobile_native:
              # [FLAW 3 FIX] Watch ROOT dependencies too. 
              # If you update a shared library in the root, the native app MUST rebuild.
              - 'package.json'
              - 'bun.lockb'
              - 'yarn.lock'
              # Mobile specific native files
              - 'code/mobile/app.json'
              - 'code/mobile/package.json'
              - 'code/mobile/ios/**'
              - 'code/mobile/android/**'
              - 'code/mobile/fastlane/**'
              - 'code/mobile/eas.json'
            mobile_any:
              - 'code/mobile/**'
      
      - name: Manual Override
        id: override
        run: |
          # Start with filter outputs
          WEB="${{ steps.filter.outputs.web }}"
          API="${{ steps.filter.outputs.api }}"
          MOBILE_NATIVE="${{ steps.filter.outputs.mobile_native }}"
          MOBILE_ANY="${{ steps.filter.outputs.mobile_any }}"
          
          # Apply manual overrides
          if [ "${{ github.event.inputs.force_web }}" == "true" ]; then
            WEB="true"
            echo "Manual override: force_web enabled"
          fi
          
          if [ "${{ github.event.inputs.force_api }}" == "true" ]; then
            API="true"
            echo "Manual override: force_api enabled"
          fi
          
          if [ "${{ github.event.inputs.force_native }}" == "true" ]; then
            MOBILE_NATIVE="true"
            MOBILE_ANY="true"
            echo "Manual override: force_native enabled"
          fi
          
          if [ "${{ github.event.inputs.force_ota }}" == "true" ]; then
            MOBILE_ANY="true"
            echo "Manual override: force_ota enabled"
          fi
          
          # Output final values
          echo "web=$WEB" >> $GITHUB_OUTPUT
          echo "api=$API" >> $GITHUB_OUTPUT
          echo "mobile_native=$MOBILE_NATIVE" >> $GITHUB_OUTPUT
          echo "mobile_any=$MOBILE_ANY" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # STEP 2: PRE-FLIGHT CHECK (The Parachute)
  # [FLAW 2 FIX] Stops broken code from ever leaving the hangar.
  # Only runs if mobile code changed.
  # ------------------------------------------------------------------
  validate-mobile:
    needs: check-changes
    if: needs.check-changes.outputs.mobile_any == 'true'
    name: 🛡️ Validate Mobile
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ./code/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      # Install dependencies (from root because monorepo)
      - name: Install Deps
        run: cd .. && bun install

      # The Check: If this fails, the pipeline dies here. 
      # No broken builds sent to Apple.
      - name: Type Check
        run: bun tsc --noEmit

  # ------------------------------------------------------------------
  # STEP 2.5: E2E TESTS (Deployment Gate)
  # Disabled to speed up deployments.
  # ------------------------------------------------------------------
  test-e2e:
    if: false
    name: 🧪 E2E Tests (Deployment Gate)
    runs-on: macos-latest
    steps:
      - run: echo "E2E deployment gate is disabled."

  # ------------------------------------------------------------------
  # STEP 3: WEB DEPLOYMENT
  # Now builds from mobile codebase using Expo Web
  # ------------------------------------------------------------------
  deploy-web:
    needs: check-changes
    # Trigger on web OR mobile changes (since web is built from mobile)
    if: needs.check-changes.outputs.web == 'true'
    name: 🌐 Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Setup Node.js (required for Expo)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Setup Bun for monorepo install
      - uses: oven-sh/setup-bun@v1
      
      # Install ALL dependencies from monorepo root
      # This resolves @ruwt/shared workspace package
      - name: Install Dependencies
        run: bun install
        working-directory: ./code
      
      # Build Expo Web (outputs to code/mobile/dist)
      - name: Build Expo Web
        run: npx expo export --platform web
        working-directory: ./code/mobile
      
      # Copy static files to web/dist
      - name: Prepare Deployment
        run: node scripts/copy-static.js
        working-directory: ./code/web
      
      # Deploy to Cloudflare Pages using Wrangler
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=ruwt
        working-directory: ./code/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ------------------------------------------------------------------
  # STEP 4: API DEPLOYMENT
  # ------------------------------------------------------------------
  deploy-api:
    needs: check-changes
    if: needs.check-changes.outputs.api == 'true'
    name: Deploy API
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ./code }
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --config api/fly.toml --dockerfile api/Dockerfile .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ------------------------------------------------------------------
  # STEP 5: MOBILE OTA (Fast Path)
  # Runs ONLY if validation passed AND no native files changed
  # ------------------------------------------------------------------
  mobile-ota:
    needs: [check-changes, validate-mobile]
    # Logic: Mobile changed + Native didn't change + Validation passed
    if: needs.check-changes.outputs.mobile_any == 'true' && needs.check-changes.outputs.mobile_native == 'false'
    name: ⚡️ Mobile OTA Update
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ./code/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: cd .. && bun install
      - name: Publish OTA
        run: eas update --branch production --message "Commit ${{ github.sha }}"

  # ------------------------------------------------------------------
  # STEP 6: MOBILE NATIVE BUILD (Safe Path)
  # Runs ONLY if validation passed AND native files changed
  # ------------------------------------------------------------------
  mobile-native:
    needs: [check-changes, validate-mobile]
    # Logic: Native changed + Validation passed
    if: needs.check-changes.outputs.mobile_native == 'true'
    name: 🏗️ Mobile Native Build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ./code/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: cd .. && bun install
      - name: Install Fastlane Deps
        run: bundle install

      # 1. SAFETY: Check Queue (Ruby)
      # If app is "In Review", this exits 1 and stops the job safely.
      - name: 🛡️ Check App Store Status
        run: bundle exec fastlane check_queue_status
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}

      # 2. BUILD: EAS (Auto-submit to TestFlight/Play Store)
      - name: 🏗️ Build & Auto-Submit
        run: eas build --platform all --profile production --auto-submit --non-interactive

      # 3. COMPLIANCE: Fastlane (Polling enabled)
      # This runs your new, smarter Fastfile
      - name: 🚀 Submit for Review & Compliance
        run: bundle exec fastlane submit_for_review
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}

      # 4. STATE: Tag successful native build
      # This tag is used as the diff base for future change detection
      - name: 📌 Tag Successful Native Build
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f production-mobile-native-last-success
          git push origin production-mobile-native-last-success --force