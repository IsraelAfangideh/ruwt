name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # STEP 1: THE BRAIN (Decide what changed)
  # ------------------------------------------------------------------
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      mobile_native: ${{ steps.filter.outputs.mobile_native }}
      mobile_any: ${{ steps.filter.outputs.mobile_any }}
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            web:
              - 'code/web/**'
            api:
              - 'code/api/**'
            mobile_native:
              # [FLAW 3 FIX] Watch ROOT dependencies too. 
              # If you update a shared library in the root, the native app MUST rebuild.
              - 'package.json'
              - 'bun.lockb'
              - 'yarn.lock'
              # Mobile specific native files
              - 'code/mobile/app.json'
              - 'code/mobile/package.json'
              - 'code/mobile/ios/**'
              - 'code/mobile/android/**'
              - 'code/mobile/fastlane/**'
              - 'code/mobile/eas.json'
            mobile_any:
              - 'code/mobile/**'

  # ------------------------------------------------------------------
  # STEP 2: PRE-FLIGHT CHECK (The Parachute)
  # [FLAW 2 FIX] Stops broken code from ever leaving the hangar.
  # Only runs if mobile code changed.
  # ------------------------------------------------------------------
  validate-mobile:
    needs: check-changes
    if: needs.check-changes.outputs.mobile_any == 'true'
    name: 🛡️ Validate Mobile
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ./code/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      # Install dependencies (from root because monorepo)
      - name: Install Deps
        run: cd .. && bun install

      # The Check: If this fails, the pipeline dies here. 
      # No broken builds sent to Apple.
      - name: Type Check
        run: bun tsc --noEmit

  # ------------------------------------------------------------------
  # STEP 3: WEB DEPLOYMENT
  # ------------------------------------------------------------------
  deploy-web:
    needs: check-changes
    if: needs.check-changes.outputs.web == 'true'
    name: Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ruwt
          directory: code/web

  # ------------------------------------------------------------------
  # STEP 4: API DEPLOYMENT
  # ------------------------------------------------------------------
  deploy-api:
    needs: check-changes
    if: needs.check-changes.outputs.api == 'true'
    name: Deploy API
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ./code }
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --config api/fly.toml --dockerfile api/Dockerfile .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ------------------------------------------------------------------
  # STEP 5: MOBILE OTA (Fast Path)
  # Runs ONLY if validation passed AND no native files changed
  # ------------------------------------------------------------------
  mobile-ota:
    needs: [check-changes, validate-mobile]
    # Logic: Mobile changed + Native didn't change + Validation passed
    if: needs.check-changes.outputs.mobile_any == 'true' && needs.check-changes.outputs.mobile_native == 'false'
    name: ⚡️ Mobile OTA Update
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ./code/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: cd .. && bun install
      - name: Publish OTA
        run: eas update --branch production --message "Commit ${{ github.sha }}"

  # ------------------------------------------------------------------
  # STEP 6: MOBILE NATIVE BUILD (Safe Path)
  # Runs ONLY if validation passed AND native files changed
  # ------------------------------------------------------------------
  mobile-native:
    needs: [check-changes, validate-mobile]
    # Logic: Native changed + Validation passed
    if: needs.check-changes.outputs.mobile_native == 'true'
    name: 🏗️ Mobile Native Build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: ./code/mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: cd .. && bun install
      - name: Install Fastlane Deps
        run: bundle install

      # 1. SAFETY: Check Queue (Ruby)
      # If app is "In Review", this exits 1 and stops the job safely.
      - name: 🛡️ Check App Store Status
        run: bundle exec fastlane check_queue_status
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}

      # 2. BUILD: EAS (Auto-submit to TestFlight/Play Store)
      - name: 🏗️ Build & Auto-Submit
        run: eas build --platform all --profile production --auto-submit --non-interactive

      # 3. COMPLIANCE: Fastlane (Polling enabled)
      # This runs your new, smarter Fastfile
      - name: 🚀 Submit for Review & Compliance
        run: bundle exec fastlane submit_for_review
        env:
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}