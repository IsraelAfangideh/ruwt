# Deploy dev app (Vite + RN Web + Cloudflare Pages Functions + D1) to Cloudflare Pages.
# Project: ruwt-dev → https://ruwt-dev.pages.dev (or custom domain in dashboard)
name: Deploy Dev (Cloudflare Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'dev/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Set runtime secrets
        run: |
          echo "32f5999dbd09eae38c1de8c15de98d48" | npx wrangler pages secret put CLOUDFLARE_ACCOUNT_ID --project-name=ruwt-dev
          echo "${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}" | npx wrangler pages secret put CLOUDFLARE_API_TOKEN --project-name=ruwt-dev
          echo "${{ secrets.VITE_SUPABASE_URL }}" | npx wrangler pages secret put VITE_SUPABASE_URL --project-name=ruwt-dev
          echo "${{ secrets.VITE_SUPABASE_ANON_KEY }}" | npx wrangler pages secret put VITE_SUPABASE_ANON_KEY --project-name=ruwt-dev
          echo "https://ruwt-exec.fly.dev/api/v2/piston" | npx wrangler pages secret put PISTON_API_URL --project-name=ruwt-dev
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler pages secret put RESEND_API_KEY --project-name=ruwt-dev
          echo "${{ secrets.CRON_SECRET }}" | npx wrangler pages secret put CRON_SECRET --project-name=ruwt-dev
          echo "${{ secrets.GH_PAT_READONLY }}" | npx wrangler pages secret put GITHUB_TOKEN --project-name=ruwt-dev
          echo "${{ secrets.ERROR_ALERT_EMAIL }}" | npx wrangler pages secret put ERROR_ALERT_EMAIL --project-name=ruwt-dev
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | npx wrangler pages secret put STRIPE_SECRET_KEY --project-name=ruwt-dev
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | npx wrangler pages secret put STRIPE_WEBHOOK_SECRET --project-name=ruwt-dev
          echo "${{ secrets.VITE_SENTRY_DSN }}" | npx wrangler pages secret put SENTRY_DSN --project-name=ruwt-dev
          echo "${{ secrets.EXECUTOR_SECRET }}" | npx wrangler pages secret put EXECUTOR_SECRET --project-name=ruwt-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: npx wrangler pages deploy dist --project-name=ruwt-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy smoke tests
        if: success()
        working-directory: .
        run: |
          echo "=== Post-deploy smoke tests ==="
          sleep 10  # Give Cloudflare edge a moment to propagate
          FAILED=0
          RESULTS=""

          # Test 1: Landing page returns 200 and contains "ruwt"
          echo "Test 1: Landing page..."
          BODY=$(curl -s --max-time 10 -o /tmp/landing.html -w '%{http_code}|%{time_total}' https://ruwt.dev/)
          HTTP=$(echo "$BODY" | cut -d'|' -f1)
          TIME=$(echo "$BODY" | cut -d'|' -f2)
          if [ "$HTTP" != "200" ]; then
            echo "  FAIL: HTTP $HTTP"
            RESULTS="${RESULTS}\n- FAIL: GET / returned HTTP $HTTP (expected 200)"
            FAILED=$((FAILED+1))
          elif ! grep -qi "ruwt" /tmp/landing.html; then
            echo "  FAIL: body missing 'ruwt'"
            RESULTS="${RESULTS}\n- FAIL: GET / body missing 'ruwt'"
            FAILED=$((FAILED+1))
          else
            echo "  PASS (${TIME}s)"
            RESULTS="${RESULTS}\n- PASS: GET / -> 200 (${TIME}s)"
          fi

          # Test 2: Challenges API returns 200 with JSON array
          echo "Test 2: Challenges API..."
          HTTP=$(curl -s --max-time 10 -o /tmp/challenges.json -w '%{http_code}' https://ruwt.dev/api/challenges)
          if [ "$HTTP" != "200" ]; then
            echo "  FAIL: HTTP $HTTP"
            RESULTS="${RESULTS}\n- FAIL: GET /api/challenges returned HTTP $HTTP"
            FAILED=$((FAILED+1))
          elif ! python3 -c "import json; d=json.load(open('/tmp/challenges.json')); assert isinstance(d,list)" 2>/dev/null; then
            echo "  FAIL: not a JSON array"
            RESULTS="${RESULTS}\n- FAIL: GET /api/challenges not a valid JSON array"
            FAILED=$((FAILED+1))
          else
            COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/challenges.json'))))")
            echo "  PASS ($COUNT challenges)"
            RESULTS="${RESULTS}\n- PASS: GET /api/challenges -> 200 ($COUNT challenges)"
          fi

          # Test 3: Profile endpoint returns 401 (auth guard working)
          echo "Test 3: Auth guard..."
          HTTP=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' https://ruwt.dev/api/profile)
          if [ "$HTTP" != "401" ]; then
            echo "  FAIL: HTTP $HTTP (expected 401)"
            RESULTS="${RESULTS}\n- FAIL: GET /api/profile returned HTTP $HTTP (expected 401)"
            FAILED=$((FAILED+1))
          else
            echo "  PASS"
            RESULTS="${RESULTS}\n- PASS: GET /api/profile -> 401 (auth guard working)"
          fi

          # Test 4: AI chat endpoint returns 400 or 401 with empty body
          echo "Test 4: AI chat endpoint..."
          HTTP=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' -X POST https://ruwt.dev/api/ai/chat -H "Content-Type: application/json" -d '{}')
          if [ "$HTTP" != "400" ] && [ "$HTTP" != "401" ]; then
            echo "  FAIL: HTTP $HTTP (expected 400 or 401)"
            RESULTS="${RESULTS}\n- FAIL: POST /api/ai/chat returned HTTP $HTTP (expected 400/401)"
            FAILED=$((FAILED+1))
          else
            echo "  PASS (HTTP $HTTP)"
            RESULTS="${RESULTS}\n- PASS: POST /api/ai/chat -> $HTTP (Functions running)"
          fi

          # Test 5: Landing page response time under 5 seconds
          echo "Test 5: Response time..."
          TIME=$(curl -s --max-time 10 -o /dev/null -w '%{time_total}' https://ruwt.dev/)
          TIME_INT=$(echo "$TIME" | awk '{printf "%.0f", $1 * 1000}')
          if [ "$TIME_INT" -gt 5000 ]; then
            echo "  FAIL: ${TIME}s (max 5s)"
            RESULTS="${RESULTS}\n- FAIL: Response time ${TIME}s (exceeds 5s)"
            FAILED=$((FAILED+1))
          else
            echo "  PASS (${TIME}s)"
            RESULTS="${RESULTS}\n- PASS: Response time ${TIME}s"
          fi

          echo ""
          echo "=== $FAILED failure(s) ==="
          printf "$RESULTS\n"

          if [ "$FAILED" -gt 0 ]; then
            curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "
          import json
          results = '''$(printf "$RESULTS")'''
          print(json.dumps({
              'from': 'ruwt.dev alerts <alerts@ruwt.dev>',
              'to': ['${{ secrets.ERROR_ALERT_EMAIL }}'],
              'subject': '[ruwt.dev SMOKE TEST] ${FAILED} test(s) failed after deploy',
              'html': '<h2>Post-Deploy Smoke Test Failures</h2><p>Commit: <code>${{ github.sha }}</code></p><pre>' + results + '</pre><p><a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View workflow run</a></p>'
          }))
          ")"
            echo "::error::$FAILED smoke test(s) failed after deploy"
            exit 1
          fi
