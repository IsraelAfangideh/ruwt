# Deploy dev app (Vite + RN Web + Cloudflare Pages Functions + D1) to Cloudflare Pages.
# Project: ruwt-dev → https://ruwt-dev.pages.dev (or custom domain in dashboard)
name: Deploy Dev (Cloudflare Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'dev/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dev/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Set runtime secrets
        run: |
          echo "${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}" | npx wrangler pages secret put CLOUDFLARE_API_TOKEN --project-name=ruwt-dev
          echo "${{ secrets.VITE_SUPABASE_URL }}" | npx wrangler pages secret put VITE_SUPABASE_URL --project-name=ruwt-dev
          echo "${{ secrets.VITE_SUPABASE_ANON_KEY }}" | npx wrangler pages secret put VITE_SUPABASE_ANON_KEY --project-name=ruwt-dev
          echo "https://ruwt-exec.fly.dev/api/v2/piston" | npx wrangler pages secret put PISTON_API_URL --project-name=ruwt-dev
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler pages secret put RESEND_API_KEY --project-name=ruwt-dev
          echo "${{ secrets.CRON_SECRET }}" | npx wrangler pages secret put CRON_SECRET --project-name=ruwt-dev
          echo "${{ secrets.GH_PAT_READONLY }}" | npx wrangler pages secret put GITHUB_TOKEN --project-name=ruwt-dev
          echo "${{ secrets.ERROR_ALERT_EMAIL }}" | npx wrangler pages secret put ERROR_ALERT_EMAIL --project-name=ruwt-dev
          echo "${{ secrets.STRIPE_SECRET_KEY }}" | npx wrangler pages secret put STRIPE_SECRET_KEY --project-name=ruwt-dev
          echo "${{ secrets.STRIPE_WEBHOOK_SECRET }}" | npx wrangler pages secret put STRIPE_WEBHOOK_SECRET --project-name=ruwt-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=ruwt-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
