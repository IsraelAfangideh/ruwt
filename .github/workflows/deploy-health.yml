# Deploy health app (Vite + RN Web + Cloudflare Pages Functions + D1) to Cloudflare Pages.
# Project: ruwt-health → https://ruwt-health.pages.dev (or custom domain ruwt.health)
name: Deploy Health (Cloudflare Pages)

on:
  push:
    branches:
      - main
    paths:
      - 'health/**'
      - '.github/workflows/deploy-health.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: health/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Set runtime secrets
        run: |
          echo "${{ secrets.VITE_SUPABASE_URL }}" | npx wrangler pages secret put SUPABASE_URL --project-name=ruwt-health
          echo "${{ secrets.VITE_SUPABASE_ANON_KEY }}" | npx wrangler pages secret put SUPABASE_ANON_KEY --project-name=ruwt-health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ruwt-health --remote
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create GitHub deployment
        id: deployment
        uses: chrnorm/deployment-action@v2
        with:
          token: ${{ github.token }}
          environment: Health Production
          production-environment: true
          ref: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: npx wrangler pages deploy dist --project-name=ruwt-health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://ruwt-health.pages.dev

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

      - name: Post-deploy smoke test
        if: success()
        run: |
          sleep 10
          HTTP=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' https://ruwt-health.pages.dev/)
          if [ "$HTTP" != "200" ]; then
            echo "::error::Smoke test failed: HTTP $HTTP"
            exit 1
          fi
          echo "Smoke test passed: HTTP $HTTP"
