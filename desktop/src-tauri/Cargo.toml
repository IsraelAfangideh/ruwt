[package]
name = "ruwt-desktop"
version = "0.2.0"
description = "Ruwt Desktop local agentic engineering intelligence"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
