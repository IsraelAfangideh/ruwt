appId: com.ruwt.app
---
- launchApp
- assertVisible: "⚠️ MOCK MODE ACTIVE"
- tapOn: "Chat"
- assertVisible: "Send me a message"
- inputText: "I'm frustrated with this situation"
- tapOn:
    id: ".*Send.*"
- assertVisible: "This feels a bit sharp"
- assertVisible: "I am feeling a bit overwhelmed right now, can we talk later?"
- assertVisible: "Send This"
- assertVisible: "Copy"
- assertVisible: "Make Kinder"
- tapOn: "Send This"
- assertVisible: "[SENT]"


