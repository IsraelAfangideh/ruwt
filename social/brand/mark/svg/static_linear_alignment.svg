<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <rect width="400" height="200" fill="#0f0e0d"/>
  
  <!-- The Sine Wave -->
  <!-- 
       Starts at 50,100
       Arches up to ~20 at x=125
       Crosses center at 200,100
       Dips down to ~180 at x=275
       Ends at 350,100
  -->
  <path d="M50,100 Q125,20 200,100 T350,100" 
        stroke="#c9a962" stroke-width="2" fill="none" opacity="0.4"/>
        
  <!-- Poles -->
  <circle cx="50" cy="100" r="6" fill="#666"/>
  <circle cx="350" cy="100" r="6" fill="#666"/>
  
  <!-- Balanced Linear Dots (All at y=100) -->
  
  <!-- 1. Left (Under the Arch) -->
  <!-- Positioned at x=100 (1/3 of the way to center) -->
  <circle cx="100" cy="100" r="6" fill="#c9a962"/>
  
  <!-- 2. Middle (Through the Intersection) -->
  <circle cx="200" cy="100" r="6" fill="#c9a962"/>
  
  <!-- 3. Right (Over the Trough) -->
  <!-- Positioned at x=300 (1/3 of the way from center) -->
  <circle cx="300" cy="100" r="6" fill="#c9a962"/>
</svg>

