<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 440 240">
  <style>
    /* Colors */
    :root {
      --color-bg: #0f0e0d;
      --color-accent: #c9a962;
      --color-accent-glow: rgba(201, 169, 98, 0.15);
      --color-text-muted: #9a938a;
    }
    
    /* Path Drawing Animation */
    .path-line {
      stroke: #c9a962;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawPath 3s ease-in-out 1s forwards;
    }
    
    @keyframes drawPath {
      to {
        stroke-dashoffset: 0;
      }
    }
    
    /* Sender Pulse */
    .sender {
      animation: pulse 2s ease-in-out infinite;
      transform-origin: center;
    }
    
    /* Runner Movement */
    .runner {
      animation: runnerMove 4s ease-in-out infinite;
    }
    
    /* Receiver Pulse (with delay) */
    .receiver {
      animation: pulse 2s ease-in-out 0.5s infinite;
      transform-origin: center;
    }
    
    @keyframes pulse {
      0%, 100% {
        opacity: 0.7;
        r: 6;
      }
      50% {
        opacity: 1;
        r: 7.5;
      }
    }
    
    @keyframes runnerMove {
      0%, 100% {
        cx: 80;
      }
      50% {
        cx: 320;
      }
    }
  </style>
  
  <rect x="-20" y="-20" width="440" height="240" fill="#0f0e0d"/>
  
  <!-- The Sine Wave Path -->
  <path class="path-line" d="M0,100 Q100,20 200,100 T400,100" fill="none" stroke-width="2"/>
  
  <!-- Sender Dot -->
  <circle class="sender" cx="0" cy="100" r="6" fill="#9a938a"/>
  
  <!-- Runner Dot (The Moving One) -->
  <circle class="runner" cx="80" cy="100" r="6" fill="#c9a962">
    <!-- Glow effect -->
  </circle>
  
  <!-- Runner Glow (Follows the runner) -->
  <circle class="runner" cx="80" cy="100" r="10" fill="#c9a962" opacity="0.2"/>
  
  <!-- Receiver Dot -->
  <circle class="receiver" cx="400" cy="100" r="6" fill="#9a938a"/>
</svg>

