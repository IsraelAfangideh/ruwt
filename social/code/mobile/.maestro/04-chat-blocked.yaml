appId: com.ruwt.app
---
- launchApp
- assertVisible: "⚠️ MOCK MODE ACTIVE"
- tapOn: "Chat"
- waitForAnimationToEnd
- scroll
- assertVisible: ".*Send me a message.*"
- tapOn:
    id: "message-input"
- inputText: "I'm frustrated with this situation"
- hideKeyboard
- tapOn: "Send"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
- scroll
- assertVisible: ".*This feels a bit sharp. Let's add some warmth to it.*"
- scroll
- assertVisible: ".*I am feeling a bit overwhelmed right now, can we talk later?.*"
- assertVisible: ".*Send.*"
- assertVisible: ".*Copy.*"
- assertVisible: ".*Make Kinder.*"
- tapOn: "Send"