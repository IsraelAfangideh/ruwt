<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Ruwt</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Libre+Franklin:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0f0e0d;
      --color-text: #e8e4df;
      --color-text-muted: #9a938a;
      --color-accent: #c9a962;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Libre Franklin', sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    
    .container {
      max-width: 500px;
    }
    
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 6rem;
      font-weight: 400;
      color: var(--color-accent);
      line-height: 1;
      margin-bottom: 1rem;
    }
    
    p {
      font-size: 1.1rem;
      color: var(--color-text-muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    a {
      display: inline-block;
      padding: 0.875rem 2rem;
      background: var(--color-accent);
      color: var(--color-bg);
      text-decoration: none;
      border-radius: 4px;
      font-weight: 400;
      transition: all 0.3s ease;
    }
    
    a:hover {
      background: transparent;
      color: var(--color-accent);
      box-shadow: inset 0 0 0 1px var(--color-accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>The Runner couldn't find what you're looking for. Perhaps the message was never sent.</p>
    <a href="/">Return Home</a>
  </div>
</body>
</html>
